name: Test

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Run tests
              run: npm test

            # Checks api/ against the Stripe and Firebase Admin type definitions,
            # so a library upgrade that drops a parameter fails here, not at checkout.
            - name: Type-check API functions
              run: npm run typecheck:api
