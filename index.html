		<!-- SEO Meta Tags -->
		<title>Slidemoji - A daily puzzle game.</title>
		<meta
			name="description"
			content="Slide the tiles to unscramble the daily emoji."
		/>
		<meta
			name="keywords"

		<meta name="theme-color" content="#ffffff" />

		<!-- Apply theme class synchronously before React hydrates to prevent flash of unstyled background -->
		<script>
			(function () {
				try {
					// Prefer the user's saved setting (mirrored to localStorage by usePreference)
					var stored = localStorage.getItem("pref_darkMode");
					var prefersDark =
						stored !== null
							? JSON.parse(stored)
							: window.matchMedia("(prefers-color-scheme: dark)")
									.matches;
					document.documentElement.classList.add(
						prefersDark ? "dark-theme" : "light-theme",
					);
					// Sync browser chrome color to initial theme
					var metaTheme = document.querySelector(
						'meta[name="theme-color"]',
					);
					if (metaTheme) {
						metaTheme.setAttribute(
							"content",
							prefersDark ? "#121212" : "#f2f2f2",
						);
					}
				} catch (e) {}
			})();
		</script>
