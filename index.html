<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
		<link rel="apple-touch-icon" href="/app-icon.svg" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link rel="canonical" href="https://slidemoji.com/" />

		<!-- Preload Google Font for faster loading -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- SEO Meta Tags -->
		<title>Slidemoji - A daily puzzle game.</title>
		<meta
			name="description"
			content="Slide the tiles to unscramble the daily emoji."
		/>
		<meta
			name="keywords"
			content="sliding puzzle, emoji puzzle, daily puzzle, brain game, puzzle game, emoji game, tile puzzle, 15 puzzle, slide puzzle"
		/>
		<meta name="author" content="Nikhil Nathwani" />
		<!-- Declare light+dark support so Safari uses prefers-color-scheme for chrome color -->
		<meta name="color-scheme" content="light dark" />
		<!-- Two theme-color entries with media queries handle system-preference at parse time.
		     The inline script below overrides them with the user's saved preference. -->
		<meta
			name="theme-color"
			media="(prefers-color-scheme: light)"
			content="#ffffff"
		/>
		<meta
			name="theme-color"
			media="(prefers-color-scheme: dark)"
			content="#181818"
		/>

		<!-- Structure data (JSON-LD) -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Slidemoji",
				"url": "https://slidemoji.com",
				"description": "Slide the tiles to unscramble the daily emoji puzzle.",
				"applicationCategory": "Game",
				"operatingSystem": "All",
				"author": {
					"@type": "Person",
					"name": "Nikhil Nathwani"
				}
			}
		</script>

		<!-- Apply theme class synchronously before React hydrates to prevent flash of unstyled background -->
		<script>
			(function () {
				try {
					// Prefer the user's saved setting (mirrored to localStorage by usePreference)
					var stored = localStorage.getItem("pref_darkMode");
					// If no saved pref, system media queries on the meta tags above are already correct —
					// no JS override needed. Only override when there's a saved preference.
					var prefersDark =
						stored !== null ? JSON.parse(stored) : null;
					var systemDark = window.matchMedia(
						"(prefers-color-scheme: dark)",
					).matches;
					var isDark =
						prefersDark !== null ? prefersDark : systemDark;
					var bg = isDark ? "#181818" : "#ffffff";
					document.documentElement.classList.add(
						isDark ? "dark-theme" : "light-theme",
					);
					// color-scheme signals browser-native UI (scrollbars, form controls,
					// browser chrome on iOS/macOS). Set here to match initial theme class.
					document.documentElement.style.colorScheme = isDark
						? "dark"
						: "light";
					// Set html/body background immediately so Safari reads the correct
					// color for the browser chrome before React mounts.
					document.documentElement.style.background = bg;
					document.body.style.background = bg;
					// When saved pref differs from system pref, override the media-query meta tags
					// so the browser chrome reflects the user's choice, not the system default.
					if (prefersDark !== null && prefersDark !== systemDark) {
						document
							.querySelectorAll('meta[name="theme-color"]')
							.forEach(function (m) {
								m.removeAttribute("media");
								m.setAttribute("content", bg);
							});
					}
				} catch (e) {}
			})();
		</script>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://slidemoji.com/" />
		<meta property="og:title" content="Slidemoji - A daily puzzle game." />
		<meta
			property="og:description"
			content="Slide the tiles to unscramble the daily emoji."
		/>
		<meta
			property="og:image"
			content="https://slidemoji.com/og-image.jpg"
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:logo" content="https://slidemoji.com/app-icon.svg" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://slidemoji.com/" />
		<meta name="twitter:title" content="Slidemoji - A daily puzzle game." />

		<meta

		/>

			src="https://www.googletagmanager.com/gtag/js?id=G-YS993J9TBR"
		></script>

			}
			gtag("js", new Date());

			gtag("config", "G-YS993J9TBR");
		</script>
	</head>
